<!doctype html>
<!--
  Entry HTML page for the Inventory Service Angular SPA.
  The Angular CLI injects bundled scripts and styles at build time.
  <app-root> is replaced by the bootstrapped AppComponent at runtime.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Inventory Service</title>
  <!-- Base href ensures the Angular router resolves paths relative to the site root. -->
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <!-- Angular root component — replaced by AppComponent once the framework bootstraps. -->
  <app-root></app-root>
</body>
</html>
