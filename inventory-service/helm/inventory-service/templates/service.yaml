# ---------------------------------------------------------------------------
# Kubernetes Service for the Inventory Service.
#
# Exposes the Deployment pods via a stable ClusterIP (default) so that
# the Ingress controller and other in-cluster consumers can reach the API.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: {{ include "inventory-service.fullname" . }}
  labels:
    {{- include "inventory-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}          # Port other services connect to
      targetPort: {{ .Values.service.targetPort }}  # Container port (8080)
      protocol: TCP
      name: http
  selector:
    {{- include "inventory-service.selectorLabels" . | nindent 4 }}
