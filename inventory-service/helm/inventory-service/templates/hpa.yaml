# ---------------------------------------------------------------------------
# Horizontal Pod Autoscaler for the Inventory Service.
#
# Only created when autoscaling.enabled is true. Scales the Deployment
# between minReplicas and maxReplicas based on average CPU utilisation.
# ---------------------------------------------------------------------------
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "inventory-service.fullname" . }}
  labels:
    {{- include "inventory-service.labels" . | nindent 4 }}
spec:
  # Reference the Deployment this HPA manages.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "inventory-service.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    # Scale based on average CPU utilisation across all pods.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
