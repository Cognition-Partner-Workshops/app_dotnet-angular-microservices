# =============================================================================
# Helm Chart metadata for the Inventory Service microservice.
#
# This chart packages the Kubernetes manifests (Deployment, Service, Ingress,
# HPA, NetworkPolicy, ServiceMonitor) required to deploy the Inventory Service
# into a Kubernetes cluster via Helm or ArgoCD.
# =============================================================================
apiVersion: v2                              # Helm chart API version (v2 = Helm 3+)
name: inventory-service                     # Chart name used by Helm releases
description: Helm chart for the Inventory microservice
type: application                           # "application" chart (as opposed to "library")
version: 0.1.0                              # Chart version (semver) — incremented on chart changes
appVersion: "1.0.0"                         # Version of the application being deployed
