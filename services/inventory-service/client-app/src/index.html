<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Inventory Service</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
    nav { background: #1976d2; padding: 16px; margin: -20px -20px 20px; color: white; }
    nav h1 { margin: 0 0 8px; font-size: 1.4rem; }
    nav a { color: #bbdefb; text-decoration: none; margin-right: 16px; }
    nav a:hover { color: white; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e0e0e0; }
    th { background: #f5f5f5; font-weight: 600; }
    .low-stock { background: #ffebee; }
    h2 { color: #333; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; }
    .badge-warning { background: #fff3e0; color: #e65100; }
    .badge-ok { background: #e8f5e9; color: #2e7d32; }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
