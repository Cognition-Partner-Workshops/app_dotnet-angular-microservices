name: Inventory Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'services/inventory-service/**'
      - 'docker/Dockerfile.inventory-service'
      - 'helm/inventory-service/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/inventory-service/**'
      - 'docker/Dockerfile.inventory-service'
      - 'helm/inventory-service/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: services/inventory-service

      - name: Build
        run: dotnet build --no-restore
        working-directory: services/inventory-service

      - name: Test
        run: dotnet test --no-build --verbosity normal
        working-directory: services/inventory-service

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f docker/Dockerfile.inventory-service -t $ECR_REGISTRY/workshop/inventory-service:$IMAGE_TAG -t $ECR_REGISTRY/workshop/inventory-service:latest .
          docker push $ECR_REGISTRY/workshop/inventory-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/workshop/inventory-service:latest
