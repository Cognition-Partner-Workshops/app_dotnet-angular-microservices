name: Inventory Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'services/inventory-service/**'
      - 'docker/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/inventory-service/**'
      - 'docker/**'
      - '.github/workflows/**'

env:
  ECR_REGISTRY: 599083837640.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: workshop/inventory-service
  AWS_REGION: us-east-1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore .NET dependencies
        run: dotnet restore
        working-directory: services/inventory-service

      - name: Build .NET project
        run: dotnet build --no-restore -c Release
        working-directory: services/inventory-service

      - name: Run .NET tests
        run: dotnet test --no-build -c Release --verbosity normal
        working-directory: services/inventory-service

      - name: Install Angular dependencies
        run: npm ci
        working-directory: services/inventory-service/client-app

      - name: Build Angular app
        run: npm run build
        working-directory: services/inventory-service/client-app

  docker-build-push:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA::8}
          docker build -f docker/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy-dev:
    needs: docker-build-push
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger ArgoCD sync for dev
        run: |
          echo "Triggering ArgoCD sync for inventory-service-dev"
          echo "Image tag: ${GITHUB_SHA::8}"

  deploy-staging:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger ArgoCD sync for staging
        run: |
          echo "Triggering ArgoCD sync for inventory-service-staging"
          echo "Image tag: ${GITHUB_SHA::8}"
